# Emberglass release (PKG-01, specs/13-implementation-plan.md §11; specs/09-operations.md §1; D-164, D-166).
#
# On a version tag `v<version>` or `v<version>-<pre-release>`, where <version> is package.json's,
# the Windows runner builds and checks the portable package with `make package`, exactly as CI's
# `package · windows` job does, and a second job attaches the zip and its SHA-256 to a GitHub
# Release for the tag. The build job runs every install script of `npm ci`, so it holds no token
# that can write; only the second job, which runs no project code, may create the release.
#
# The release is a draft until the package gates of PKG-03 run before it (`13` §11): the owner
# publishes it by hand until then (D-166).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: '0'

jobs:
  package:
    name: package · windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SETUP_BROWSERS: ''
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No cache: a release is built from the lockfile alone.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          release: false
          update: false
          path-type: inherit
          # make alone: the package build and its check run no Python on Windows (review S-L3).
          install: make
      - name: The tag names this version
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *) echo "::error::The tag $GITHUB_REF_NAME is not v$version or v$version-<pre-release> (package.json)."; exit 1 ;;
          esac
          echo "EMBERGLASS_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: make setup
        run: make setup
      - name: make package
        run: make package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows
          path: |
            dist/package/*.zip
            dist/package/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: draft release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-windows
          path: package
      - name: Draft the GitHub Release with the zip and its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$(ls package/*.zip)"
          (cd package && sha256sum --check --strict "$(basename "$zip").sha256")
          {
            echo "Emberglass ${GITHUB_REF_NAME#v} for Windows x64: a portable zip with its own Node.js runtime."
            echo
            echo "Unzip it into a folder of its own and double-click Emberglass.cmd; README.txt inside says the rest."
            echo "The package is not signed: Windows SmartScreen may warn before the first start."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat package/*.zip.sha256
            echo '```'
          } > notes.md
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" package/*.zip package/*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
            --title "Emberglass ${GITHUB_REF_NAME#v}" --notes-file notes.md
