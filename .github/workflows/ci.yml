# Emberglass CI (FND-02, specs/13-implementation-plan.md §3; D-060, D-061).
#
# Every gate job runs exactly one root Makefile target, so "CI is green" and
# "`make verify` is green" are the same statement (specs/10-testing-acceptance.md §1).
# The steps before it only provision the machine: checkout, Node from .nvmrc,
# `make setup`, and on Windows the MSYS2 shell that provides make and bash.
# Nothing retries: a flaky gate is a red gate. README.md "Continuous integration"
# maps every job to its command. The failing-forward tripwires of D-061 are gone:
# REL-02 promoted the last two gates into `make e2e` and `make build` (D-127).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Colour codes make the logs unreadable in the browser; CI output is plain text.
  FORCE_COLOR: '0'

jobs:
  linux:
    name: ${{ matrix.target }} · linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [lint, format-check, typecheck, test, e2e, build, check-docs, audit, scan-secrets]
    env:
      # Only the e2e job runs a browser; on Linux it also needs the system libraries. Chromium
      # runs every spec, Firefox and WebKit the acceptance journeys (specs/10 §4, D-127).
      SETUP_BROWSERS: ${{ matrix.target == 'e2e' && '--with-deps chromium firefox webkit' || '' }}
      EMBERGLASS_E2E_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs the token; npm install scripts should not see it.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.target != 'check-docs'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Playwright browser cache
        if: matrix.target == 'e2e'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-webkit-${{ hashFiles('package-lock.json') }}
      - name: make setup
        if: matrix.target != 'check-docs'
        run: make setup
      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}
      - name: Keep Playwright output of a failed run
        if: failure() && matrix.target == 'e2e'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-linux
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: ${{ matrix.target }} · windows
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [lint, format-check, typecheck, test, e2e, build, check-docs, audit, scan-secrets]
    env:
      # Edge is on the image already; Playwright drives it through its channel (D-127).
      SETUP_BROWSERS: ${{ matrix.target == 'e2e' && 'chromium firefox webkit' || '' }}
      EMBERGLASS_E2E_BROWSERS: chromium,firefox,webkit,msedge
    defaults:
      run:
        # The image has no make. MSYS2 (preinstalled, off PATH) supplies make,
        # bash and python3; `inherit` keeps the Windows PATH, so node, npm and git
        # are the native Windows ones and the product runs as it does for a DM.
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs the token; npm install scripts should not see it.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.target != 'check-docs'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          release: false
          update: false
          path-type: inherit
          install: make python
      - name: Playwright browser cache
        if: matrix.target == 'e2e'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-webkit-${{ hashFiles('package-lock.json') }}
      - name: make setup
        if: matrix.target != 'check-docs'
        run: make setup
      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}
      - name: Keep Playwright output of a failed run
        if: failure() && matrix.target == 'e2e'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-windows
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
